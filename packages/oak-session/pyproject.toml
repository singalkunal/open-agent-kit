[project]
name = "oak-session"
version = "0.1.0"
description = "Session rehydration, lease coordination, and per-framework wrappers for oak."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "oak contributors" }]
dependencies = [
    "pydantic>=2.6",
    "anyio>=4.3",
    "opentelemetry-api>=1.27",
    "oak-workspace>=0.1.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
staso = ["staso"]
langfuse = ["langfuse>=2.0"]
phoenix = ["arize-phoenix-client>=1.0"]
logfire = ["logfire>=2.0"]
openhands = ["openhands-sdk>=1.0"]
all = [
    "redis>=5.0",
    "asyncpg>=0.29",
    "staso",
    "langfuse>=2.0",
    "arize-phoenix-client>=1.0",
    "logfire>=2.0",
    "openhands-sdk>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.uv.sources]
oak-workspace = { workspace = true }

[project.entry-points."oak.session.state_stores"]
in_memory = "oak_session.state_stores.in_memory:InMemoryStateStore"

[project.entry-points."oak.session.trace_sources"]
otlp = "oak_session.trace_sources.otlp:OTLPSpansTraceSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_session"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["oak_workspace", "oak_workspace.*", "staso", "staso.*", "openhands.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
