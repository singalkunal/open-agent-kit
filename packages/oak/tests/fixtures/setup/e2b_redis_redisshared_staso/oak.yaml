# Generated by `oak setup`. Drop into your repo root and load at startup with
# `oak.session.configure_from_yaml("oak.yaml")`.
#
# Schema is versioned. Bump `version` only when this file's shape changes.
version: 1

# Workspace provider: where the agent's tools run.
workspace:
  kind: e2b
  api_key_env: E2B_API_KEY
  idle_timeout_ms: 900000

# Durable per-session state. Where AttachedSession blobs live across restarts.
state_store:
  kind: redis
  url_env: REDIS_URL

# Lease coordinator: prevents two workers from owning the same session at once.
lease:
  kind: redis
  url_env: REDIS_URL
  ttl_seconds: 30

# Trace source: where rehydrated history is fetched from on cold start.
tracing:
  kind: staso
  api_key_env: STASO_API_KEY

# Agent framework wrapper used at attach() time.
framework:
  kind: openhands
