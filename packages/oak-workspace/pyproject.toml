[project]
name = "oak-workspace"
version = "0.1.0"
description = "Framework-neutral sandbox protocol for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "oak contributors" }]
dependencies = [
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
docker = ["docker"]
e2b = ["e2b-code-interpreter"]
openhands = ["openhands-sdk"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.entry-points."oak.workspaces"]
local = "oak_workspace.local_process:LocalProcessWorkspace"
local_process = "oak_workspace.local_process:LocalProcessWorkspace"
local_docker = "oak_workspace.local_docker:LocalDockerWorkspace"
e2b = "oak_workspace.e2b:E2BWorkspace"

[[tool.mypy.overrides]]
module = ["e2b_code_interpreter", "e2b_code_interpreter.*", "docker", "docker.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Path.mkdir / Path.stat / Path.write_bytes inside async funcs is fine for
# our small ops; we don't depend on trio/anyio path.
"src/oak_workspace/local_process.py" = ["ASYNC110", "ASYNC240"]
"src/oak_workspace/local_docker.py" = ["ASYNC240"]
"src/oak_workspace/e2b.py" = ["ASYNC240"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_workspace"]
